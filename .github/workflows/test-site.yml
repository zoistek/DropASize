name: Update test website

# Every push to the "test" branch puts web/index.html on the test website
# (GitHub Pages, served from the gh-pages branch). No Android build happens.
on:
  push:
    branches: [test]
    paths:
      - 'web/**'
      - '.github/workflows/test-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          mkdir /tmp/site
          cp web/index.html /tmp/site/index.html
          mkdir -p /tmp/site/admin
          cp web/admin.html /tmp/site/admin/index.html
          cp -r web/pages/. /tmp/site/
          if [ -d web/voice ]; then mkdir -p /tmp/site/voice && cp web/voice/manifest.json /tmp/site/voice/ && (cp web/voice/*.mp3 /tmp/site/voice/ 2>/dev/null || true); fi
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Test site from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
