name: Draw exercise images (Nano Banana 2)

# Run from the Actions tab. Draws the exercise images listed in tools/exercise-art/exercises.json
# that don't exist yet, in the style of goblet-squat-before/-after.webp, saves them as WebP in
# web/pages/exercises/, links them in the app, then refreshes the test website.
# Safe to re-run: finished images are skipped.
# Also runs on a push to test that changes tools/exercise-art/only.txt (sets to draw; empty = all missing),
# because Run workflow only appears once this file is on the default branch.
on:
  push:
    branches: [test]
    paths: ['tools/exercise-art/only.txt']
  workflow_dispatch:
    inputs:
      only:
        description: 'Image sets to draw, comma separated (empty = everything still missing)'
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: exercise-art
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pillow==10.4.0
      - name: Install image-save script dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/art-build" --no-package-lock --ignore-scripts --no-audit --no-fund @babel/parser@7.29.12 @babel/traverse@7.29.12 @babel/generator@7.29.12
          echo "NODE_PATH=$RUNNER_TEMP/art-build/node_modules" >> "$GITHUB_ENV"
      - name: Draw
        env:
          GEMINI_API_KEY: ${{ secrets.VOICE }}
          ONLY: ${{ inputs.only }}
        run: |
          [ "$GITHUB_EVENT_NAME" = push ] && export ONLY="$(cat tools/exercise-art/only.txt)"
          python3 tools/exercise-art/generate.py
      - name: Save the images
        if: always()
        run: |
          node web/build.js
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add web tools/exercise-art
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git commit -qm "Exercises: draw images (Nano Banana 2)"
          git pull -q --rebase && git push -q  # another workflow may have pushed meanwhile
          gh workflow run test-site.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
