<!doctype html>
<html lang="en"><body style="margin:0;padding:24px;background:#F4F6F2;font-family:Arial,sans-serif;color:#0F2418">
<div style="max-width:480px;margin:auto;padding:28px;background:#fff;border:1px solid #DFEBD5;border-radius:24px">
<h1 style="margin:0 0 20px;font-size:26px;color:#0E351D">DropASize</h1>
<h2 style="font-size:21px">Verify your email</h2>
<p style="line-height:1.6">Enter this code in DropASize to finish creating your account:</p>
<p style="padding:18px;background:#EEF8E3;border-radius:16px;font-size:30px;font-weight:bold;letter-spacing:5px;text-align:center;color:#0E351D">{{ .Token }}</p>
<p style="font-size:13px;line-height:1.6;color:#6B726E">Keep this code private. If you didn’t request an account, you can ignore this email.</p>
<p style="font-size:13px;line-height:1.6">Using an older version of the app? <a href="{{ .ConfirmationURL }}" style="color:#0E351D">Confirm your email here</a>.</p>
</div></body></html>
